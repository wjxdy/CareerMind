spring:
  application:
    name: careermind

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/careermind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:careermind-secret-key-2024-for-jwt-signing}
  expiration: ${JWT_EXPIRATION:86400000}

# 大模型 API 配置
llm:
  default-provider: kimi

  kimi:
    api-key: ${KIMI_API_KEY:}
    base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
    model: ${KIMI_MODEL:moonshot-v1-8k}
    temperature: 0.7
    max-tokens: 2000

  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: gpt-4
    temperature: 0.7
    max-tokens: 2000

  claude:
    api-key: ${CLAUDE_API_KEY:}
    base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com/v1}
    model: claude-3-sonnet-20240229
    temperature: 0.7
    max-tokens: 2000

# RAG 服务配置
rag:
  service:
    url: ${RAG_SERVICE_URL:http://localhost:3000}

logging:
  level:
    com.careermind: DEBUG
    org.springframework.web.socket: DEBUG
