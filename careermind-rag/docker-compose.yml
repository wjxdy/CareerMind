version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      - RAG_PORT=3000
      - RAG_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - rag_uploads:/app/uploads
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  rag_uploads:
